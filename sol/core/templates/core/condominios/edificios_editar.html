<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Editar edificio</title>
</head>

<body>

    <header>

        <h1>
            Editar edificio
        </h1>

        <p>
            Condominio:
            <strong>
                {{ edificio.condominio.nombre }}
            </strong>
        </p>

    </header>


    <main>

        <form method="post">

            {% csrf_token %}


            <p>

                <label for="nombre">
                    Nombre del edificio:
                </label>

                <br>

                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    value="{{ edificio.nombre }}"
                    maxlength="50"
                    required
                >

            </p>


            <p>

                <label for="numero_pisos">
                    Número de pisos:
                </label>

                <br>

                <input
                    type="number"
                    id="numero_pisos"
                    name="numero_pisos"
                    value="{{ edificio.numero_pisos|default:'' }}"
                    min="2"
                    max="20"
                    required
                >

            </p>


            <p>

                <label for="viviendas_por_piso">
                    Viviendas por piso:
                </label>

                <br>

                <input
                    type="number"
                    id="viviendas_por_piso"
                    name="viviendas_por_piso"
                    value="{{ edificio.viviendas_por_piso|default:'' }}"
                    min="1"
                    required
                >

            </p>


            <p>

                <label>

                    <input
                        type="checkbox"
                        name="subterraneo"
                        {% if edificio.subterraneo %}checked{% endif %}
                    >

                    Tiene subterráneo

                </label>

            </p>


            <button type="submit">
                Guardar cambios
            </button>

        </form>


        <br>


        <a href="{% url 'edificios_lista' edificio.condominio.id %}">
            Volver a edificios
        </a>

    </main>


    <footer>

        <hr>

        <a href="{% url 'inicio' %}">
            Inicio
        </a>

        |

        <a href="{% url 'logout' %}">
            Cerrar sesión
        </a>

    </footer>

</body>

</html>
