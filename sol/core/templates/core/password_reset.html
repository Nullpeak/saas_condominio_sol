<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Recuperar contraseña</title>
</head>

<body>

    <h1>Recuperar contraseña</h1>

    <p>Ingresa el correo electrónico asociado a tu cuenta.</p>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Enviar enlace de recuperación
        </button>

    </form>

    <a href="{% url 'login' %}">
        Volver al inicio de sesión
    </a>

</body>
</html>
