<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Iniciar sesión</title>
</head>

<body>

    <h1>Iniciar sesión</h1>

    {% if error %}
        <p>
            {{ error }}
        </p>
    {% endif %}

    <form method="post">

        {% csrf_token %}

        <div>
            <label for="username">
                Usuario:
            </label>

            <input
                type="text"
                id="username"
                name="username"
                required
            >
        </div>

        <br>

        <div>
            <label for="password">
                Contraseña:
            </label>

            <input
                type="password"
                id="password"
                name="password"
                required
            >
        </div>

        <br>

        <button type="submit">
            Iniciar sesión
        </button>
        <a href="{% url 'password_reset_request' %}">
        ¿Olvidaste tu contraseña?
        </a>
    </form>

</body>

</html>
