<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nueva contraseña</title>
</head>

<body>

    {% if validlink %}

        <h1>Crear nueva contraseña</h1>

        <p>Ingresa tu nueva contraseña para recuperar el acceso a tu cuenta.</p>

        <form method="post">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">
                Cambiar contraseña
            </button>

        </form>

    {% else %}

        <h1>Enlace no válido</h1>

        <p>
            Este enlace de recuperación ya fue utilizado
            o ha expirado.
        </p>

        <a href="{% url 'password_reset_request' %}">
            Solicitar un nuevo enlace
        </a>

    {% endif %}

</body>
</html>
