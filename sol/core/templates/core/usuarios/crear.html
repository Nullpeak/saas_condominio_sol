<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Crear usuario</title>

</head>

<body>

    <h1>
        Crear usuario
    </h1>


    {% if errores %}

        <div>

            <h3>
                Errores:
            </h3>

            <ul>

                {% for error in errores %}

                    <li>
                        {{ error }}
                    </li>

                {% endfor %}

            </ul>

        </div>

    {% endif %}


    <form method="post">

        {% csrf_token %}


        <h2>
            Datos de acceso
        </h2>


        <label for="username">
            Nombre de usuario:
        </label>

        <input
            type="text"
            id="username"
            name="username"
            value="{{ datos.username|default:'' }}"
            required
        >

        <br><br>


        <label for="password">
            Contraseña:
        </label>

        <input
            type="password"
            id="password"
            name="password"
            required
        >

        <br><br>


        <label for="password_confirmacion">
            Confirmar contraseña:
        </label>

        <input
            type="password"
            id="password_confirmacion"
            name="password_confirmacion"
            required
        >


        <h2>
            Datos personales
        </h2>


        <label for="nombre">
            Nombre:
        </label>

        <input
            type="text"
            id="nombre"
            name="nombre"
            value="{{ datos.nombre|default:'' }}"
            required
        >

        <br><br>


        <label for="nombre2">
            Segundo nombre:
        </label>

        <input
            type="text"
            id="nombre2"
            name="nombre2"
            value="{{ datos.nombre2|default:'' }}"
        >

        <br><br>


        <label for="apellido">
            Apellido:
        </label>

        <input
            type="text"
            id="apellido"
            name="apellido"
            value="{{ datos.apellido|default:'' }}"
            required
        >

        <br><br>


        <label for="apellido2">
            Segundo apellido:
        </label>

        <input
            type="text"
            id="apellido2"
            name="apellido2"
            value="{{ datos.apellido2|default:'' }}"
        >

        <br><br>


        <label for="rut">
            RUT:
        </label>

        <input
            type="text"
            id="rut"
            name="rut"
            value="{{ datos.rut|default:'' }}"
        >

        <br><br>


        <label for="email">
            Correo electrónico:
        </label>

        <input
            type="email"
            id="email"
            name="email"
            value="{{ datos.email|default:'' }}"
            required
        >

        <br><br>


        <label for="telefono">
            Teléfono:
        </label>

        <input
            type="text"
            id="telefono"
            name="telefono"
            value="{{ datos.telefono|default:'' }}"
        >


        <h2>
            Configuración
        </h2>


        <label for="rol">
            Rol:
        </label>

        <select
            id="rol"
            name="rol"
            required
        >

            <option value="">
                Seleccionar rol
            </option>

            {% for rol in roles %}

                <option
                    value="{{ rol.id }}"
                >
                    {{ rol.nombre }}
                </option>

            {% endfor %}

        </select>

        <br><br>


        <label for="condominio">
            Condominio:
        </label>

        <select
            id="condominio"
            name="condominio"
        >

            <option value="">
                Sin condominio
            </option>

            {% for condominio in condominios %}

                <option
                    value="{{ condominio.id }}"
                >
                    {{ condominio.nombre }}
                </option>

            {% endfor %}

        </select>


        <br><br>


        <button type="submit">
            Crear usuario
        </button>

    </form>


    <br>

    <a href="{% url 'usuarios_lista' %}">
        Cancelar
    </a>

</body>

</html>
